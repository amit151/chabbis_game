name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Android Wrapper if Missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.chabbis --project-name chabbis_26
          fi

      - name: Configure Google Services for Android
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            if grep -q "plugins {" android/settings.gradle.kts 2>/dev/null; then
              sed -i 's/id("com.android.application") version "\([^"]*\)" apply false/id("com.android.application") version "\1" apply false\n    id("com.google.gms.google-services") version "4.4.2" apply false/' android/settings.gradle.kts
              sed -i 's/id("com.android.application")/id("com.android.application")\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts
            elif grep -q "plugins {" android/settings.gradle 2>/dev/null; then
              sed -i "s/id \"com.android.application\" version \"[^\"]*\" apply false/id \"com.android.application\" version \"&\" apply false\n    id \"com.google.gms.google-services\" version \"4.4.2\" apply false/" android/settings.gradle
              sed -i "s/apply plugin: \"com.android.application\"/apply plugin: \"com.android.application\"\napply plugin: \"com.google.gms.google-services\"/" android/app/build.gradle
            fi
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chabbis-26-release-apk
          path: build/app/outputs/apk/release/app-release.apk
